# Phase 2 edge: strangler proxy. Default backend is legacy (XAMPP).
# /web-gallery is aliased from disk so hotel CSS survives a Laravel outage.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format hotel '$remote_addr $backend $status $req_id '
                     '"$request" $body_bytes_sent "$http_referer"';
    access_log /var/log/nginx/access.log hotel;

    # Fail closed: anything not listed in cutover.map is `legacy`.
    map $uri $backend {
        default legacy;
        include /etc/nginx/cutover.map;
    }

    resolver 127.0.0.11 ipv6=off valid=10s;

    # XAMPP Apache on the Windows host, or `legacy-apache` in --profile full.
    upstream legacy {
        server host.docker.internal:8080;
        keepalive 16;
    }

    upstream cms {
        server cms:80;
        keepalive 16;
    }

    upstream vite {
        server vite:5173;
        keepalive 8;
    }

    server {
        listen 80 default_server;
        server_name hotel.test localhost _;

        add_header X-Request-Id $req_id always;
        add_header X-Hotel-Backend $backend always;

        # Cheap probe used by the edge healthcheck. Does not hit PHP.
        location = /web-gallery-health {
            default_type text/plain;
            return 200 "web-gallery-alias-ok\n";
        }

        # ---- Frozen visual contract ------------------------------------
        # Two PHPRetro stubs (must stay on Apache):
        location = /web-gallery/js/local/com.js {
            proxy_pass http://legacy;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $req_id;
        }
        location = /web-gallery/styles/local/com.css {
            proxy_pass http://legacy;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $req_id;
        }

        # Everything else under /web-gallery is static files from the submodule.
        # Laravel MUST NOT own this prefix. No hashing, no Vite, no copy into cms/public.
        location ^~ /web-gallery/ {
            alias /var/www/web-gallery/;
            expires 30d;
            add_header Cache-Control "public";
            add_header X-Hotel-Backend "web-gallery-alias" always;
            try_files $uri =404;
        }

        # Vite HMR (local only). Production uses hashed files under /build/.
        location ^~ /@vite/ {
            proxy_pass http://vite;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
        location ^~ /resources/ {
            proxy_pass http://vite;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Laravel built assets.
        location ^~ /build/ {
            proxy_pass http://cms;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $req_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else: cutover map chooses cms or legacy.
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $req_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # $backend is `cms` or `legacy` (upstream names). Default is legacy.
            proxy_pass http://$backend;
        }
    }
}
