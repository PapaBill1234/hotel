# Phase 2 — Laravel beside XAMPP.
# Default: nginx edge, Laravel cms, Vite, Redis, Mailpit, Horizon, scheduler.
# XAMPP on the Windows host owns Apache :8080 and MySQL :3306.
# Profile `full` adds a container MySQL + PHP Apache (no XAMPP). Never the default.

name: hotel

services:
  edge:
    image: nginx:1.27-alpine
    ports:
      - "${EDGE_PORT:-80}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/cutover.map:/etc/nginx/cutover.map:ro
      - ./legacy/web-gallery:/var/www/web-gallery:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      cms:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/web-gallery-health"]
      interval: 10s
      timeout: 3s
      retries: 8
    restart: unless-stopped

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    env_file:
      - ./cms/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./cms:/var/www
      - cms_vendor:/var/www/vendor
      - cms_node_modules:/var/www/node_modules
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "about", "--only=environment"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  vite:
    image: node:22-alpine
    working_dir: /var/www
    volumes:
      - ./cms:/var/www
      - cms_node_modules:/var/www/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  horizon:
    build:
      context: ./cms
      dockerfile: Dockerfile
    env_file:
      - ./cms/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./cms:/var/www
      - cms_vendor:/var/www/vendor
    command: ["php", "artisan", "horizon"]
    depends_on:
      cms:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: ./cms
      dockerfile: Dockerfile
    env_file:
      - ./cms/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./cms:/var/www
      - cms_vendor:/var/www/vendor
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      cms:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    profiles: ["full"]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: hotel
      MYSQL_DATABASE: hotel_cms_sys
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./ops/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uhotel", "-photel"]
      interval: 10s
      timeout: 5s
      retries: 10

  legacy-apache:
    profiles: ["full"]
    image: php:8.2-apache
    volumes:
      - ./legacy:/var/www/html:ro
    ports:
      - "8080:80"

volumes:
  redis_data:
  cms_vendor:
  cms_node_modules:
  mysql_data:
